services:
  redis:
    image: redis:7-alpine
    container_name: crypto-arb-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  arb-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-arb-bot
    command: ["-config", "configs/local.yaml"]
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      TZ: UTC
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
